name: Build
on:
  push:
    branches-ignore:
      - 'dependabot/**'
  pull_request: ~
  release:
    types: [ created ]
  schedule:
    - cron: "0 1 * * 6"
  workflow_dispatch: ~

jobs:
  tests:
    runs-on: ubuntu-latest

    name: "Sylius ${{ matrix.sylius }}, PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}, MySQL ${{ matrix.mysql }}, Trix ${{ matrix.trix }}"

    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.5"]
        symfony: ["7.4.*"]
        sylius: ["~2.3.0"]
        node: ["24.x"]
        mysql: ["8.0"]
        trix: [false, true]

    env:
      APP_ENV: test
      DATABASE_URL: "mysql://root:root@127.0.0.1/sylius?serverVersion=${{ matrix.mysql }}"

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php }}"
          extensions: intl
          tools: symfony
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "${{ matrix.node }}"

      - name: Start MySQL
        run: sudo systemctl start mysql.service

      - name: Output PHP version for Symfony CLI
        run: php -v | head -n 1 | awk '{ print $2 }' > .php-version

      - name: Run Chrome Headless
        run: google-chrome-stable --enable-automation --disable-background-networking --no-default-browser-check --no-first-run --disable-popup-blocking --disable-default-apps --allow-insecure-localhost --disable-translate --disable-extensions --no-sandbox --enable-features=Metal --headless --remote-debugging-port=9222 --window-size=2880,1800 --proxy-server='direct://' --proxy-bypass-list='*' http://127.0.0.1 > /dev/null 2>&1 &

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.json', '**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Restrict Symfony version
        run: composer config extra.symfony.require "${{ matrix.symfony }}"

      - name: Restrict Sylius version
        run: composer require "sylius/sylius:${{ matrix.sylius }}" --no-update --no-scripts --no-interaction

      - name: Install PHP dependencies
        run: composer install --no-interaction

      - name: Install Behat driver
        run: vendor/bin/bdi browser:google-chrome drivers

      - name: Get Yarn cache directory
        id: yarn-cache
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - name: Cache Yarn
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-node-${{ matrix.node }}-yarn-${{ hashFiles('**/package.json', '**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node }}-yarn-

      - name: Configure Trix if enabled
        if: matrix.trix == true
        run: |
          sed -i "s|admin/entry|admin/trix-entry|" assets/admin/entrypoint.js
          printf "\nbit_bag_sylius_cms:\n    wysiwyg_editor: trix\n" >> tests/TestApplication/config/config.yaml

      - name: Install JS dependencies
        run: (cd vendor/sylius/test-application && yarn install)

      - name: Prepare test application database
        run: |
          vendor/bin/console doctrine:database:create -vvv
          vendor/bin/console doctrine:migrations:migrate -n -vvv -q

      - name: Prepare test application assets
        run: |
          vendor/bin/console assets:install -vvv
          (cd vendor/sylius/test-application && yarn build:prod)

      - name: Prepare test application cache
        run: vendor/bin/console cache:warmup -vvv

      - name: Load fixtures in test application
        run: vendor/bin/console sylius:fixtures:load -n

      - name: Run webserver
        run: symfony server:start --no-tls --port=8080 --dir=vendor/sylius/test-application/public --daemon

      - name: Validate composer.json
        run: composer validate --ansi --strict

      - name: Validate database mapping
        run: vendor/bin/console doctrine:schema:validate --skip-sync

      - name: Run PHPSpec
        run: vendor/bin/phpspec run --ansi -f progress --no-interaction

      - name: Run PHPUnit
        run: vendor/bin/phpunit --colors=always

      - name: Set Behat tags
        if: matrix.trix != true
        run: echo "BEHAT_TAGS=--tags='~@wysiwyg'" >> $GITHUB_ENV

      - name: Run Behat
        run: vendor/bin/behat ${{ env.BEHAT_TAGS }} --colors --strict -vvv --no-interaction -f progress || vendor/bin/behat ${{ env.BEHAT_TAGS }} --colors --strict -vvv --no-interaction -f progress --rerun

      - name: Upload Behat logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Behat logs PHP ${{ matrix.php }} Trix ${{ matrix.trix }}
          path: etc/build/
          if-no-files-found: ignore

